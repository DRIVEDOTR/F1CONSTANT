name: Actualites F1
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/f1-news.yml'
      - 'scripts/update-news.py'
      - 'scripts/news_enrich.py'
      - 'scripts/local_model.py'
      - 'scripts/requirements-news.txt'
permissions:
  contents: write
concurrency:
  group: f1-news-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-news.txt
      - name: Installer le moteur de résumé local
        continue-on-error: true
        timeout-minutes: 10
        env:
          CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_BLAS=OFF -DGGML_CUDA=OFF'
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: python -m pip install -r scripts/requirements-news.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .cache/f1-models
          key: qwen3-4b-q4-2fde00ce69dd4899
      - name: Préparer et vérifier le modèle
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/local_model.py --prepare
      - name: Collecter et résumer en français
        timeout-minutes: 30
        env:
          F1_SUMMARY_LIMIT: '12'
          F1_SUMMARY_SECONDS: '1500'
        run: python3 scripts/update-news.py
      - name: Enregistrer la collecte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/f1-news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser les titres F1 et leur historique'
            git push
          fi
