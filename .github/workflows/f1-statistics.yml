name: Statistiques F1
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/f1-statistics.yml'
      - 'scripts/update-statistics.py'
      - 'scripts/test-statistics.py'
permissions:
  contents: write
concurrency:
  group: f1-site-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tester les règles de mise à jour
        run: python3 scripts/test-statistics.py
      - name: Actualiser les statistiques publiées
        run: python3 scripts/update-statistics.py
      - name: Vérifier le JavaScript généré
        run: |
          node --check assets/site.js
          python3 scripts/test-statistics.py
      - name: Enregistrer uniquement une nouvelle copie valide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.js data/f1-data-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser les palmarès, résultats et records F1'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
